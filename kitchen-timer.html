<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таймер готовки — Кулинарный Штурман</title>
<link rel="stylesheet" href="styles.css">
<style>
.controls{display:flex;gap:10px;justify-content:center;margin-top:20px}
.control-btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:.3s}
.start{background:var(--secondary);color:#fff}
.start:hover{background:#6da98e}
.reset{background:#ddd;color:#333}
.reset:hover{background:#ccc}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:20px}
.preset-btn{padding:10px;background:#fff;border:1px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;font-size:.9rem}
.preset-btn:hover{background:var(--bg);border-color:var(--accent)}
/* Анимация пульсации при завершении */
@keyframes pulse-red {
0% { box-shadow: 0 0 0 0 rgba(224, 122, 95, .7); }
70% { box-shadow: 0 0 0 20px rgba(224, 122, 95, 0); }
100% { box-shadow: 0 0 0 0 rgba(224, 122, 95, 0); }
}
.timer-circle.finished { animation: pulse-red 1.5s infinite; border-color: #ef4444 !important; }
</style>
</head>
<body>
<div class="container">
<header style="margin-bottom:20px"><a href="index.html" style="color:var(--accent);font-weight:bold;text-decoration:none">← На главную</a></header>
<h1>⏲️ Таймер шеф-повара</h1>
<p class="subtitle">Звуковой сигнал предупредит, когда пора снимать блюдо.</p>

<div class="calc-wrapper" style="text-align:center">
<!-- КРУГ ТАЙМЕРА -->
<div class="timer-circle" id="timerCircle">
<div class="timer-inner">
<span class="timer-display" id="timeDisplay">00:00</span>
<small id="statusText">Выбери время ниже</small>
</div>
</div>

<!-- КНОПКИ УПРАВЛЕНИЯ -->
<div class="controls">
<button class="control-btn start" id="startBtn">▶ Старт</button>
<button class="control-btn reset" id="resetBtn">↺ Сброс</button>
</div>

<!-- БЫСТРЫЕ ПРЕСЕТЫ -->
<div class="preset-grid">
<button class="preset-btn" onclick="setTime(60)">🥚 Яйцо всмятку<br>(1 мин)</button>
<button class="preset-btn" onclick="setTime(180)">🍝 Паста Al Dente<br>(3 мин)</button>
<button class="preset-btn" onclick="setTime(300)">🥔 Картошка в мундире<br>(5 мин)</button>
<button class="preset-btn" onclick="setTime(600)"> Куриные бедра<br>(10 мин)</button>
<button class="preset-btn" onclick="setTime(1800)">🥩 Тушение мяса<br>(30 мин)</button>
<button class="preset-btn" onclick="setCustom()">✍️ Свое время</button>
</div>
</div>

<footer>© 2026 Кулинарный Штурман · Приятного аппетита!</footer>
</div>

<script>
let totalTime = 0;
let remainingTime = 0;
let timerInterval = null;
let audioCtx = null; // Контекст для звука

const circle = document.getElementById('timerCircle');
const display = document.getElementById('timeDisplay');
const status = document.getElementById('statusText');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');

// --- ЗВУКОВАЯ СИСТЕМА ---
function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
}

function playBeep(freq = 880, duration = 0.5, type = 'square') {
initAudio();
const osc = audioCtx.createOscillator();
const gainNode = audioCtx.createGain();

osc.type = type; // square, sine, sawtooth
osc.frequency.value = freq;
gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

osc.connect(gainNode);
gainNode.connect(audioCtx.destination);

osc.start();
osc.stop(audioCtx.currentTime + duration);
}

function playAlarmSequence() {
// Три коротких писка подряд
playBeep(880, 0.2);
setTimeout(() => playBeep(880, 0.2), 300);
setTimeout(() => playBeep(1200, 0.4), 600);
}

// --- ЛОГИКА ТАЙМЕРА ---
function formatTime(sec) {
const m = Math.floor(sec / 60).toString().padStart(2, '0');
const s = (sec % 60).toString().padStart(2, '0');
return `${m}:${s}`;
}

function updateVisuals() {
display.innerText = formatTime(remainingTime);
// Обновление градиента круга
const pct = totalTime > 0 ? ((totalTime - remainingTime) / totalTime) * 360 : 0;
circle.style.background = `conic-gradient(var(--accent) ${pct}deg, var(--border) ${pct}deg)`;

// Проверка окончания
if (remainingTime <= 0 && totalTime > 0) {
clearInterval(timerInterval);
status.innerText = "ГОТОВО! 🔔";
startBtn.disabled = true;
startBtn.style.opacity = ".5";
circle.classList.add('finished'); // Добавляем класс для красной пульсации
playAlarmSequence(); // Играем звук
}
}

function setTime(seconds) {
totalTime = seconds;
remainingTime = seconds;
updateVisuals();
status.innerText = "Нажмите Старт";
startBtn.disabled = false;
startBtn.style.opacity = "1";
circle.classList.remove('finished');
}

function setCustom() {
const mins = prompt("Введите минуты:", "5");
if(mins && !isNaN(mins)) setTime(parseInt(mins)*60);
}

// Обработчики кнопок
startBtn.onclick = () => {
initAudio(); // Разблокируем аудио при первом клике пользователя
if(timerInterval) clearInterval(timerInterval);
status.innerText = "Идет отсчет... ⏳";
timerInterval = setInterval(() => {
remainingTime--;
updateVisuals();
}, 1000);
};

resetBtn.onclick = () => {
clearInterval(timerInterval);
setTime(0);
};

// Инициализация пустого состояния
setTime(0);

</script>
</body>
</html>
