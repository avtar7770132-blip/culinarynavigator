<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор теста — Кулинарный Штурман</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<style>.presets{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.preset-btn{padding:8px 15px;background:#f9f9f9;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.9rem}.preset-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}</style>
</head>
<!-- MICROSOFT CLARITY НАЧАЛО -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

<!-- MICROSOFT CLARITY КОНЕЦ --><body>
<div class="container">
<header style="margin-bottom:20px"><a href="index.html" style="color:var(--accent);font-weight:bold;text-decoration:none">← На главную</a></header>
<h1>🍞 Калькулятор идеального теста</h1>
<p class="subtitle">Профессиональные пропорции (Baker's %) для пиццы, хлеба и пельменей.</p>

<div class="calc-wrapper">
<div class="form-group">
<label>Тип изделия</label>
<select id="doughType">
<option value="pizza_neapolitan">Пицца Неаполитанская (тонкое)</option>
<option value="bread_classic">Хлеб классический (батон)</option>
<option value="pelmeni">Пельмени/Вареники (плотное)</option>
<option value="flatbread">Лепешки/Фокачча (маслянистое)</option>
</select>
</div>

<div class="form-group">
<label>Вес муки (грамм)</label>
<input type="number" id="flourWeight" value="500" min="100" step="50">
<small>Совет: 500г муки ≈ 4 средних пиццы или 1 большая буханка.</small>
</div>

<button onclick="calculateDough()" class="btn-link" style="width:100%">Рассчитать ингредиенты</button>

<div id="resultDough" class="result-box"></div>
</div>

<footer>© 2026 Кулинарный Штурман</footer>
</div>

<script>
// Процентные соотношения ингредиентов (от веса муки = 100%)
const RECIPES = {
    pizza_neapolitan: { water: 60, yeast_dry: 0.2, salt: 2, oil: 0, sugar: 0 },
    bread_classic:    { water: 65, yeast_dry: 1.0, salt: 2, oil: 5, sugar: 5 },
    pelmeni:          { water: 45, yeast_dry: 0,   salt: 1.5, oil: 0, sugar: 0 }, // Без дрожжей, только вода
    flatbread:        { water: 70, yeast_dry: 1.5, salt: 2, oil: 10, sugar: 3 }
};

function calculateDough() {
    const type = document.getElementById('doughType').value;
    const flour = parseFloat(document.getElementById('flourWeight').value);
    
    if (!flour || flour <= 0) return alert("Введите вес муки");

    const r = RECIPES[type];
    
    // Расчет граммов
    const water = Math.round(flour * (r.water / 100));
    const yeastDry = (flour * (r.yeast_dry / 100)).toFixed(1);
    const yeastFresh = (yeastDry * 3).toFixed(1); // Свежие дрожжи в 3 раза больше сухих
    const salt = Math.round(flour * (r.salt / 100));
    const oil = Math.round(flour * (r.oil / 100));
    const sugar = Math.round(flour * (r.sugar / 100));

    let html = `<h3>Рецепт для ${flour} г муки:</h3><ul>`;
    html += `<li>💧 Вода (теплая): <strong>${water} мл</strong></li>`;
    
    if (parseFloat(yeastDry) > 0) {
        html += `<li>🌾 Дрожжи сухие: <strong>${yeastDry} г</strong> (~${Math.ceil(yeastDry)} ч.л.)</li>`;
        html += `<li>🔄 Или свежие прессованные: <strong>${yeastFresh} г</strong></li>`;
    } else {
        html += `<li>⚠️ Дрожжи не требуются (бездрожжевое тесто).</li>`;
    }
    
    html += `<li>🧂 Соль: <strong>${salt} г</strong> (~${Math.round(salt/5)} ч.л.)</li>`;
    
    if (oil > 0) html += `<li>🫒 Масло растительное: <strong>${oil} мл</strong></li>`;
    if (sugar > 0) html += `<li>🍬 Сахар: <strong>${sugar} г</strong></li>`;
    
    html += `</ul><div class="ti">💡 Порядок замеса: Смешай воду и дрожжи → добавь муку и соль → вмешай масло в конце.</div>`;
    
    document.getElementById('resultDough').innerHTML = html;
    document.getElementById('resultDough').classList.add('show');
}
</script>
</body>
</html>
